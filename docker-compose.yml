# 一键启动：PostgreSQL + FastAPI + Nginx
# 使用：cp .env.example .env && docker compose up -d --build
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: eval_platform
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d eval_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://demo:demo123@db:5432/eval_platform
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      ANONYMIZED_TELEMETRY: "False"
    ports:
      - "8000:8000"
    volumes:
      # 模型与向量库持久化，避免每次重建都重新下载 embedding
      - model-cache:/app/.cache/huggingface
      - chroma-data:/app/chroma_db

  web:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pg-data:
  model-cache:
  chroma-data:
