name: Daily Regression

# 每日全量回归：跑完整黄金集并与全量基线对比。
# 不阻断任何合并，失败通过 Actions 通知告警，用于发现「慢慢变差」。

on:
  schedule:
    - cron: '0 2 * * *'        # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-daily-regression
  cancel-in-progress: false

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('app/embedding.py') }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt

      - name: Build knowledge base
        env:
          HF_ENDPOINT: https://hf-mirror.com
          ANONYMIZED_TELEMETRY: 'False'
        run: python scripts/ingest.py

      - name: Run full golden set
        env:
          HF_ENDPOINT: https://hf-mirror.com
          ANONYMIZED_TELEMETRY: 'False'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/run_eval.py \
            --dataset eval_datasets/golden_set.json \
            --prompt-version "daily-${GITHUB_RUN_ID}" \
            --output reports/daily-result.json

      - name: Compare with full baseline
        run: |
          python scripts/quality_gate.py \
            reports/daily-result.json \
            baselines/full.json \
            --comment reports/daily-comment.md

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-report
          path: reports/
