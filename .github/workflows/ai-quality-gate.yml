name: AI Quality Gate

# PR 门禁：Prompt / 被测应用 / 评测集 / 门禁逻辑改动时，跑 20 条冒烟集，
# 指标低于阈值或相对基线掉太多，直接阻断合并。

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'app/**'
      - 'evaluation/**'
      - 'eval_datasets/**'
      - 'scripts/run_eval.py'
      - 'scripts/quality_gate.py'
      - 'baselines/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('app/embedding.py') }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt

      - name: Build knowledge base
        env:
          HF_ENDPOINT: https://hf-mirror.com
          ANONYMIZED_TELEMETRY: 'False'
        run: python scripts/ingest.py

      - name: Run smoke evaluation (20 cases)
        env:
          HF_ENDPOINT: https://hf-mirror.com
          ANONYMIZED_TELEMETRY: 'False'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/run_eval.py \
            --dataset eval_datasets/golden_set.json \
            --limit 20 \
            --prompt-version "${GITHUB_HEAD_REF:-manual}" \
            --output reports/gate-result.json

      - name: Quality gate check
        id: gate
        run: |
          python scripts/quality_gate.py \
            reports/gate-result.json \
            baselines/latest.json \
            --comment reports/gate-comment.md

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: reports/

      - name: Comment gate result on PR
        if: always() && github.event_name == 'pull_request' && steps.gate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '⚠️ AI 质量门禁未通过，请下载 ai-eval-report 产物查看详情。';
            try {
              body = fs.readFileSync('reports/gate-comment.md', 'utf8');
            } catch (err) {
              console.log('gate-comment.md 不存在，使用默认提示');
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
