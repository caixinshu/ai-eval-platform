name: Release Gate

# 发布门禁：打 tag 或手动触发，跑全量黄金集 + 对抗集 + 边界集。
# 黄金集看质量指标门禁，对抗/边界集看断言通过率，任一不达标阻断发布。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('app/embedding.py') }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt

      - name: Build knowledge base
        env:
          HF_ENDPOINT: https://hf-mirror.com
          ANONYMIZED_TELEMETRY: 'False'
        run: python scripts/ingest.py

      - name: Golden set (quality gate)
        env:
          HF_ENDPOINT: https://hf-mirror.com
          ANONYMIZED_TELEMETRY: 'False'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/run_eval.py \
            --dataset eval_datasets/golden_set.json \
            --prompt-version "${GITHUB_REF_NAME}" \
            --output reports/release-golden.json
          python scripts/quality_gate.py \
            reports/release-golden.json \
            baselines/full.json \
            --comment reports/release-comment.md

      - name: Adversarial set (assertion >= 0.90)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          HF_ENDPOINT: https://hf-mirror.com
          ANONYMIZED_TELEMETRY: 'False'
        run: |
          python scripts/run_eval.py \
            --dataset eval_datasets/adversarial_set.json \
            --prompt-version "${GITHUB_REF_NAME}" \
            --no-semantic \
            --min-assertion 0.90 \
            --output reports/release-adversarial.json

      - name: Edge set (assertion >= 0.85)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          HF_ENDPOINT: https://hf-mirror.com
          ANONYMIZED_TELEMETRY: 'False'
        run: |
          python scripts/run_eval.py \
            --dataset eval_datasets/edge_set.json \
            --prompt-version "${GITHUB_REF_NAME}" \
            --no-semantic \
            --min-assertion 0.85 \
            --output reports/release-edge.json

      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-release-report
          path: reports/
